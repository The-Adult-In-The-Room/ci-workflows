# An optional input forwarded into another action with nothing stopping a
# consumer from omitting it. An empty `node-version-file` reaches setup-node as
# an empty string, not as a visible error. Expected: rule 3.
name: Verify
on:
  workflow_call:
    inputs:
      node-version-file:
        description: Path to the Node version file.
        required: false
        type: string

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: The-Adult-In-The-Room/ci-workflows/.github/actions/setup-node@v1.0.0
        with:
          node-version-file: ${{ inputs.node-version-file }}