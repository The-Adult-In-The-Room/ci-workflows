# Bug 3 — a required secret with no description.
#
# The consumer cannot tell what to pass, so they reach for `secrets: inherit`
# and the run fails at call time. Expected: rule 5.
name: Lighthouse
on:
  workflow_call:
    secrets:
      lhci-github-app-token:
        required: true

jobs:
  lhci:
    runs-on: ubuntu-latest
    steps:
      - run: npx lhci autorun