name: Scheduled Regression Tests

on:
  workflow_call:
    inputs:
      command:
        description: npm script that runs the regression e2e suite.
        required: false
        type: string
        default: test:e2e:regression
      base-url:
        description: Production URL to run regression tests against.
        required: false
        type: string
        default: ""
      base-url-required:
        description: Fail the workflow if base-url is empty.
        required: false
        type: boolean
        default: false
      timeout-minutes:
        description: Job timeout in minutes.
        required: false
        type: number
        default: 10

jobs:
  regression:
    name: regression
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    env:
      REGRESSION_BASE_URL: ${{ inputs.base-url }}
    steps:
      - uses: actions/checkout@v7

      - name: Require production URL
        if: ${{ inputs.base-url-required }}
        run: |
          if [ -z "$REGRESSION_BASE_URL" ]; then
            echo "Set the base-url input or REGRESSION_BASE_URL repository variable."
            exit 1
          fi

      - uses: The-Adult-In-The-Room/ci-workflows/.github/actions/playwright-test@v1.0.1
        with:
          command: ${{ inputs.command }}
