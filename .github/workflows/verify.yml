name: Verify

on:
  workflow_call:
    inputs:
      node-version-file:
        description: Path to the Node version file.
        required: false
        type: string
        default: .nvmrc
      verify-command:
        description: Command that runs typecheck, lint, format, and unit tests.
        required: false
        type: string
        default: npm run verify
      acceptance-command:
        description: npm script for acceptance e2e tests.
        required: false
        type: string
        default: test:e2e:acceptance
      build-command:
        description: Command that produces a production build.
        required: false
        type: string
        default: npm run build
      lhci-command:
        description: Command that runs Lighthouse CI.
        required: false
        type: string
        default: npx lhci autorun
      run-lighthouse:
        description: Run Lighthouse CI as part of the verify workflow.
        required: false
        type: boolean
        default: false
    secrets:
      lhci-github-app-token:
        description: Token for the Lighthouse CI GitHub app.
        required: false

jobs:
  lint-and-test:
    name: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: The-Adult-In-The-Room/ci-workflows/.github/actions/setup-node@v2.0.0
        with:
          node-version-file: ${{ inputs.node-version-file }}
      - run: ${{ inputs.verify-command }}

  acceptance:
    name: acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: The-Adult-In-The-Room/ci-workflows/.github/actions/playwright-test@v2.0.0
        with:
          command: ${{ inputs.acceptance-command }}

  lighthouse:
    name: lighthouse
    runs-on: ubuntu-latest
    # Lighthouse CI needs a GitHub app token. Dependabot PRs run with a
    # read-only token and no access to repository secrets, so skip the job
    # entirely when the token is not available. The job remains advisory: the
    # merge gate below ignores its result. See issue #7.
    if: inputs.run-lighthouse && secrets.lhci-github-app-token != ''
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: The-Adult-In-The-Room/ci-workflows/.github/actions/setup-node@v2.0.0
        with:
          node-version-file: ${{ inputs.node-version-file }}
      - name: Build
        run: ${{ inputs.build-command }}
      - name: Run Lighthouse CI
        run: ${{ inputs.lhci-command }}
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.lhci-github-app-token }}

  verify:
    name: verify
    runs-on: ubuntu-latest
    needs: [lint-and-test, acceptance, lighthouse]
    if: always()
    steps:
      # The merge gate is intentionally secret-free. Lighthouse is an advisory
      # signal; requiring it would block Dependabot PRs that cannot access
      # repository secrets. See issue #7.
      - name: Require lint-and-test and acceptance to pass
        if: ${{ needs.lint-and-test.result != 'success' || needs.acceptance.result != 'success' }}
        run: |
          echo "lint-and-test result: ${{ needs.lint-and-test.result }}"
          echo "acceptance result: ${{ needs.acceptance.result }}"
          exit 1
      - name: Report advisory Lighthouse result
        run: 'echo "lighthouse result: ${{ needs.lighthouse.result }} (advisory; not part of the merge gate)"'
      - run: echo "Verify workflow passed."
