# Reusable workflow: consumers call this via `workflow_call` from their own repos.
# Consumer reference example:
#   uses: The-Adult-In-The-Room/ci-workflows/.github/workflows/verify.yml@v2.3.0
# This workflow is part of the public API. Check names, inputs, and secrets are stable.

name: Verify

on:
  workflow_call:
    inputs:
      node-version-file:
        description: Path to the Node version file.
        required: false
        type: string
        default: .nvmrc
      verify-command:
        description: Command that runs typecheck, lint, format, and unit tests.
        required: false
        type: string
        default: npm run verify
      acceptance-command:
        description: npm script for acceptance e2e tests.
        required: false
        type: string
        default: test:e2e:acceptance
      build-command:
        description: Command that produces a production build.
        required: false
        type: string
        default: npm run build
      lhci-command:
        description: Command that runs Lighthouse CI.
        required: false
        type: string
        default: npx lhci autorun
      run-lighthouse:
        description: Run Lighthouse CI as part of the verify workflow.
        required: false
        type: boolean
        default: false
    secrets:
      lhci-github-app-token:
        description: Token for the Lighthouse CI GitHub app.
        required: false

jobs:
  lint-and-test:
    name: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: The-Adult-In-The-Room/ci-workflows/.github/actions/setup-node@v2.3.0
        with:
          node-version-file: ${{ inputs.node-version-file }}
      - run: "$VERIFY_COMMAND"
        env:
          VERIFY_COMMAND: ${{ inputs.verify-command }}

  acceptance:
    name: acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: The-Adult-In-The-Room/ci-workflows/.github/actions/playwright-test@v2.3.0
        with:
          command: ${{ inputs.acceptance-command }}

  lighthouse:
    name: lighthouse
    runs-on: ubuntu-latest
    if: inputs.run-lighthouse
    env:
      LHCI_GITHUB_APP_TOKEN: ${{ secrets.lhci-github-app-token }}
    steps:
      - name: Require Lighthouse token
        if: env.LHCI_GITHUB_APP_TOKEN == ''
        run: |
          echo "secrets.lhci-github-app-token must be set when run-lighthouse is true."
          exit 1
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: The-Adult-In-The-Room/ci-workflows/.github/actions/setup-node@v2.3.0
        with:
          node-version-file: ${{ inputs.node-version-file }}
      - name: Build
        run: "$BUILD_COMMAND"
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
      - name: Run Lighthouse CI
        run: "$LHCI_COMMAND"
        env:
          LHCI_COMMAND: ${{ inputs.lhci-command }}

  verify:
    name: verify
    runs-on: ubuntu-latest
    needs: [lint-and-test, acceptance, lighthouse]
    if: always()
    steps:
      - name: Require all verify jobs to pass
        if: ${{ needs.lint-and-test.result != 'success' || needs.acceptance.result != 'success' || (needs.lighthouse.result != 'success' && needs.lighthouse.result != 'skipped') }}
        run: |
          echo "lint-and-test result: ${{ needs.lint-and-test.result }}"
          echo "acceptance result: ${{ needs.acceptance.result }}"
          echo "lighthouse result: ${{ needs.lighthouse.result }}"
          exit 1
      - run: echo "Verify workflow passed."

