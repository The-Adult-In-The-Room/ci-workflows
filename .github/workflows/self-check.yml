name: Self Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint workflows and actions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # rhysd/actionlint publishes only vX.Y.Z tags, with no floating `v1`
      # ref, so this must stay pinned to an exact version.
      - uses: rhysd/actionlint@v1.7.12
