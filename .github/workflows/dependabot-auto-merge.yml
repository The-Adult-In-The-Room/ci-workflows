# Reusable workflow: consumers call this via `workflow_call` from their own repos.
# Consumer reference example:
#   uses: The-Adult-In-The-Room/ci-workflows/.github/workflows/dependabot-auto-merge.yml@v2.3.0
# This workflow is part of the public API. Check names, inputs, and secrets are stable.

name: Dependabot auto-merge

on:
  workflow_call:
    inputs:
      check-name:
        description: Name of the required check to wait for before merging.
        required: false
        type: string
        default: CI / verify
      merge-method:
        description: Merge method passed to `gh pr merge`.
        required: false
        type: string
        default: squash
      checks-discovery-timeout:
        description: >-
          Seconds to wait for the required check to be discovered before
          failing. Dependabot PRs trigger this workflow before the verify
          workflow has created its check runs, so this must be long enough
          for the verify workflow to start (typically 60–120s). Defaults to
          300s (5 minutes).
        required: false
        type: number
        default: 300

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Wait for ${{ inputs.check-name }} check
        uses: lewagon/wait-on-check-action@v1.9.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          check-name: ${{ inputs.check-name }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10
          checks-discovery-timeout: ${{ inputs.checks-discovery-timeout }}

      - run: gh pr merge --auto --"$MERGE_METHOD" "$PR_URL"
        env:
          MERGE_METHOD: ${{ inputs.merge-method }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
