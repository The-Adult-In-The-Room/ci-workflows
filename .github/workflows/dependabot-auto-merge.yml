# Reusable workflow: consumers call this via `workflow_call` from their own repos.
# Consumer reference example:
#   uses: The-Adult-In-The-Room/ci-workflows/.github/workflows/dependabot-auto-merge.yml@v3.0.0
# This workflow is part of the public API. Check names, inputs, and secrets are stable.
#
# The caller must trigger on completion of the consumer's verify workflow:
#   on:
#     workflow_run:
#       workflows: [<name of the verify caller workflow>]
#       types: [completed]
# This workflow does not poll: it runs after verify completes, merges open
# Dependabot PRs when the run succeeded, and exits green otherwise.

name: Dependabot auto-merge

on:
  workflow_call:
    inputs:
      merge-method:
        description: Merge method passed to `gh pr merge`.
        required: false
        type: string
        default: squash

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Require workflow_run trigger
        if: github.event_name != 'workflow_run'
        run: |
          echo "::error::dependabot-auto-merge.yml must run after the verify workflow completes."
          echo "::error::Update the caller to trigger on: workflow_run: { workflows: [<verify workflow name>], types: [completed] }"
          exit 1

      - name: Find the Dependabot pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PULL_REQUESTS: ${{ toJSON(github.event.workflow_run.pull_requests) }}
        run: |
          set -euo pipefail

          if [ "$CONCLUSION" != "success" ]; then
            echo "Source workflow run concluded '$CONCLUSION'; nothing to merge."
            echo "url=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # PRs attached to the workflow_run event; empty for push-triggered runs.
          numbers="$(jq -r '.[]?.number' <<< "$PULL_REQUESTS")"

          # Fall back to an API lookup by head SHA for events where the
          # pull_requests array is not populated.
          if [ -z "$numbers" ]; then
            numbers="$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/pulls" \
              --jq ".[] | select(.state == \"open\" and .head.sha == \$ENV.HEAD_SHA) | .number")"
          fi

          for number in $numbers; do
            pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$number")"
            state="$(jq -r '.state' <<< "$pr")"
            author="$(jq -r '.user.login' <<< "$pr")"
            echo "PR #$number: state=$state author=$author"
            if [ "$state" = "open" ] && [ "$author" = "dependabot[bot]" ]; then
              url="$(jq -r '.html_url' <<< "$pr")"
              echo "url=$url" >> "$GITHUB_OUTPUT"
              echo "Found open Dependabot PR: $url"
              exit 0
            fi
          done

          echo "No open Dependabot PR found for $HEAD_SHA; nothing to merge."
          echo "url=" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge
        if: steps.pr.outputs.url != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_METHOD: ${{ inputs.merge-method }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: gh pr merge --auto --"$MERGE_METHOD" "$PR_URL"
