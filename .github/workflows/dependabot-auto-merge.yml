name: Dependabot auto-merge

on:
  workflow_call:
    inputs:
      check-name:
        description: Name of the required check to wait for before merging.
        required: false
        type: string
        default: CI / verify
      merge-method:
        description: Merge method passed to `gh pr merge`.
        required: false
        type: string
        default: squash

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Wait for ${{ inputs.check-name }} check
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          check-name: ${{ inputs.check-name }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10

      - run: gh pr merge --auto --${{ inputs.merge-method }} "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
