# Reusable workflow: consumers call this via `workflow_call` from their own repos.
# Consumer reference example:
#   uses: The-Adult-In-The-Room/ci-workflows/.github/workflows/lighthouse.yml@v3.0.0
# This workflow is part of the public API. Check names, inputs, and secrets are stable.

name: Lighthouse

on:
  workflow_call:
    inputs:
      node-version-file:
        description: Path to the Node version file.
        required: false
        type: string
        default: .nvmrc
      build-command:
        description: Command that produces a production build.
        required: false
        type: string
        default: npm run build
      lhci-version:
        description: Version range of @lhci/cli to install globally.
        required: false
        type: string
        default: "0.15.x"
      lhci-command:
        description: Command that runs Lighthouse CI.
        required: false
        type: string
        default: npx lhci autorun
    secrets:
      lhci-github-app-token:
        description: Token for the Lighthouse CI GitHub app.
        required: true

jobs:
  lhci:
    name: lighthouse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: The-Adult-In-The-Room/ci-workflows/.github/actions/setup-node@v3.0.0
        with:
          node-version-file: ${{ inputs.node-version-file }}

      - name: Build
        run: "$BUILD_COMMAND"
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}

      - name: Run Lighthouse CI
        run: "$LHCI_COMMAND"
        env:
          LHCI_COMMAND: ${{ inputs.lhci-command }}
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.lhci-github-app-token }}
