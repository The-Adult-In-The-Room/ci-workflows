# Canary dispatcher: dispatches the blog canary workflow on PRs.
# This workflow runs on every PR to ci-workflows, moves the `canary` tag
# to the PR head commit, and dispatches the blog canary to test the reusable
# workflows against the changes.
#
# Concurrency: dispatches are serialized. If multiple PRs trigger simultaneously,
# they queue up instead of racing (which would cause tag conflicts).
#
# Status checks: Always posts status checks for all targets. If a target isn't
# run, posts "skipped" status. This allows canary checks to be required in
# branch protection rules.

name: Canary Dispatcher

on:
  pull_request:
    branches: [main]

# Serialize dispatches to prevent tag races
concurrency:
  group: canary-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    name: dispatch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Fetch full history so we can diff against main
          fetch-depth: 0
          # Use PAT for tag manipulation (needs contents:write on ci-workflows)
          token: ${{ secrets.CANARY_PAT }}

      - uses: The-Adult-In-The-Room/ci-workflows/.github/actions/setup-node@v4.0.0

      - name: Compute canary targets
        id: scope
        run: |
          # Get list of changed files in this PR as an array
          mapfile -t CHANGED_FILES < <(git diff --name-only origin/main...HEAD)
          echo "Changed files:"
          printf '%s\n' "${CHANGED_FILES[@]}"
          
          # Compute targets
          TARGETS=$(node scripts/canary-scope.ts "${CHANGED_FILES[@]}")
          echo "targets=$TARGETS" >> "$GITHUB_OUTPUT"
          echo "Computed targets: $TARGETS"

      - name: Check if targets are empty
        id: check
        run: |
          TARGETS='${{ steps.scope.outputs.targets }}'
          if [ "$TARGETS" = "[]" ]; then
            echo "No canary targets to run"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post skipped status for unneeded targets
        if: always()
        env:
          CANARY_PAT: ${{ secrets.CANARY_PAT }}
          REF: ${{ github.event.pull_request.head.sha }}
          TARGETS: ${{ steps.scope.outputs.targets }}
        run: |
          # Define all possible targets
          ALL_TARGETS='["verify", "lighthouse", "deploy"]'
          
          # Use Node.js to check which targets are needed and post skipped status
          node -e "
          const targets = new Set($TARGETS);
          const allTargets = $ALL_TARGETS;
          
          async function postStatus(context, state, description) {
            const response = await fetch(
              'https://api.github.com/repos/The-Adult-In-The-Room/ci-workflows/statuses/$REF',
              {
                method: 'POST',
                headers: {
                  'Authorization': 'token $CANARY_PAT',
                  'Accept': 'application/vnd.github+json',
                  'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                  state: state,
                  description: description,
                  context: context
                })
              }
            );
            
            if (!response.ok) {
              console.error('Failed to post status for ' + context + ': ' + response.status);
              process.exit(1);
            }
            
            console.log('Posted ' + state + ' status for ' + context);
          }
          
          async function main() {
            for (const target of allTargets) {
              if (!targets.has(target)) {
                await postStatus('canary / ' + target, 'success', 'Canary target skipped (no relevant changes)');
              }
            }
          }
          
          main();
          "

      - name: Move canary tag to PR head
        if: steps.check.outputs.skip != 'true'
        env:
          CANARY_PAT: ${{ secrets.CANARY_PAT }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Configure git to use PAT for authentication
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          
          # Delete existing canary tag (if any) and create new one on PR head
          git push origin :refs/tags/canary 2>/dev/null || true
          git tag -f canary "$PR_HEAD_SHA"
          git push origin canary
          
          echo "Moved canary tag to $PR_HEAD_SHA"

      - name: Dispatch to blog canary
        if: steps.check.outputs.skip != 'true'
        env:
          CANARY_PAT: ${{ secrets.CANARY_PAT }}
          PR: ${{ github.event.pull_request.number }}
          REF: ${{ github.event.pull_request.head.sha }}
          TARGETS: ${{ steps.scope.outputs.targets }}
        run: |
          # -f: return non-zero on HTTP 4xx/5xx (otherwise curl exits 0 on any completed request)
          curl -f -X POST \
            -H "Authorization: token $CANARY_PAT" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/The-Adult-In-The-Room/blog/dispatches \
            -d "{
              \"event_type\": \"canary\",
              \"client_payload\": {
                \"pr\": $PR,
                \"ref\": \"$REF\",
                \"targets\": $TARGETS
              }
            }"
          
          echo "Dispatched canary to blog with targets: $TARGETS"
          echo "PR: $PR"
          echo "REF: $REF"
