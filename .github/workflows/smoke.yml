name: Smoke Tests

on:
  workflow_call:
    inputs:
      command:
        description: npm script that runs the smoke e2e suite.
        required: false
        type: string
        default: test:e2e:smoke
      base-url:
        description: Optional base URL to run smoke tests against. When empty, the smoke script uses its own default target.
        required: false
        type: string
        default: ""

jobs:
  smoke:
    name: smoke
    runs-on: ubuntu-latest
    env:
      SMOKE_BASE_URL: ${{ inputs.base-url }}
    steps:
      - uses: actions/checkout@v7
      - uses: The-Adult-In-The-Room/ci-workflows/.github/actions/playwright-test@v2.0.0
        with:
          command: ${{ inputs.command }}
