name: Smoke Tests

on:
  workflow_call:
    inputs:
      command:
        description: npm script that runs the smoke e2e suite.
        required: false
        type: string
        default: test:e2e:smoke

jobs:
  smoke:
    name: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: The-Adult-In-The-Room/ci-workflows/.github/actions/playwright-test@v1.0.1
        with:
          command: ${{ inputs.command }}
